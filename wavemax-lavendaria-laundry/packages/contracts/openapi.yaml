openapi: 3.1.0
info:
  title: Wavemax Operational API
  version: 0.1.0
servers:
  - url: /v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /session:
    get:
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current application session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orders:
    get:
      operationId: listOrders
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sourceStatus
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: paymentStatus
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: createdFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: createdTo
          in: query
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Authorized order queue with explicit source coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orders/{orderId}:
    get:
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: Exact authorized order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The order does not exist within the authorized store scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: A complete operational order source is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /workforce:
    get:
      operationId: listWorkforce
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role-scoped workforce result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyCollectionResponse"
  /analytics:
    get:
      operationId: getAnalytics
      summary: Owner-only analytics overview built from the supplied source files
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The analytics artifact, or an explicit unavailable state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnalyticsArtifactResponse"
                  - $ref: "#/components/schemas/AnalyticsUnavailableResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /analytics/metrics:
    get:
      operationId: listAnalyticsMetrics
      summary: Compact metric summaries, each carrying coverage state and known limitations
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metric summaries, or an explicit unavailable state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MetricSummaryListResponse"
                  - $ref: "#/components/schemas/AnalyticsUnavailableResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /analytics/metrics/{metricId}:
    get:
      operationId: getAnalyticsMetric
      summary: One metric with its full definition, values, and data-quality outcome
      security:
        - bearerAuth: []
      parameters:
        - name: metricId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z0-9_]{1,64}$"
      responses:
        "200":
          description: The metric, or an explicit unavailable state
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MetricDetailResponse"
                  - $ref: "#/components/schemas/AnalyticsUnavailableResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /finance:
    get:
      operationId: getFinance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner-only empty finance state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableAreaResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /data-sources:
    get:
      operationId: getDataSources
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owner-only connector configuration state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourcesResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Identity is missing or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The authenticated user cannot access this resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request was malformed or failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Role:
      type: string
      enum: [OWNER, MANAGER, EMPLOYEE]
    CoverageState:
      type: string
      enum: [COMPLETE, PARTIAL]
      description: >-
        Whether the supplied evidence covers the measure's intended population completely.
        PARTIAL measures must state what they exclude.
    MetricDefinition:
      type: object
      description: >-
        Everything required to defend a published number. A value is never shown without one.
      required:
        [
          metric_id,
          label,
          business_meaning,
          formula,
          source_system,
          source_files,
          source_fields,
          unit,
          grain,
          population,
          inclusions,
          exclusions,
          null_treatment,
          duplicate_treatment,
          rounding,
          timezone_basis,
          coverage_state,
          coverage_note,
          known_limitations,
          drill_down,
          definition_version,
        ]
      properties:
        metric_id: { type: string }
        label: { type: string }
        business_meaning: { type: string }
        formula: { type: string }
        source_system: { type: string }
        source_files: { type: array, items: { type: string } }
        source_fields: { type: array, items: { type: string } }
        unit: { type: string }
        grain: { type: string }
        population: { type: string }
        inclusions: { type: array, items: { type: string } }
        exclusions: { type: array, items: { type: string } }
        null_treatment: { type: string }
        duplicate_treatment: { type: string }
        rounding: { type: string }
        timezone_basis: { type: string }
        coverage_state: { $ref: "#/components/schemas/CoverageState" }
        coverage_note: { type: string }
        known_limitations: { type: array, items: { type: string } }
        drill_down: { type: string }
        definition_version: { type: string }
    PeriodValue:
      type: object
      required: [period, value, day_count]
      properties:
        period: { type: string }
        value:
          type: string
          description: Decimal rendered as a string so money is never subject to float rounding.
        day_count: { type: integer }
    MetricQuality:
      type: object
      required: [input_rows, accepted_rows, quarantined_rows, reason_counts, warning_counts]
      properties:
        input_rows: { type: integer }
        accepted_rows: { type: integer }
        quarantined_rows: { type: integer }
        reason_counts: { type: object, additionalProperties: { type: integer } }
        warning_counts: { type: object, additionalProperties: { type: integer } }
    Metric:
      type: object
      required:
        [
          definition,
          unit,
          machine_scope,
          business_event,
          source_coverage_note,
          total,
          first_day,
          last_day,
          distinct_days,
          by_year,
          by_month,
          by_day,
          quality,
        ]
      properties:
        definition: { $ref: "#/components/schemas/MetricDefinition" }
        unit: { type: string }
        machine_scope: { type: string }
        business_event: { type: string }
        source_coverage_note: { type: string }
        total: { type: string }
        first_day: { type: string, nullable: true }
        last_day: { type: string, nullable: true }
        distinct_days: { type: integer }
        by_year: { type: array, items: { $ref: "#/components/schemas/PeriodValue" } }
        by_month: { type: array, items: { $ref: "#/components/schemas/PeriodValue" } }
        by_day: { type: array, items: { $ref: "#/components/schemas/PeriodValue" } }
        quality: { $ref: "#/components/schemas/MetricQuality" }
    MetricSummary:
      type: object
      required:
        [
          metric_id,
          label,
          unit,
          total,
          first_day,
          last_day,
          distinct_days,
          coverage_state,
          coverage_note,
          known_limitations,
          quarantined_rows,
        ]
      properties:
        metric_id: { type: string }
        label: { type: string }
        unit: { type: string }
        total: { type: string }
        first_day: { type: string, nullable: true }
        last_day: { type: string, nullable: true }
        distinct_days: { type: integer }
        coverage_state: { $ref: "#/components/schemas/CoverageState" }
        coverage_note: { type: string }
        known_limitations: { type: array, items: { type: string } }
        quarantined_rows: { type: integer }
    AnalyticsSource:
      type: object
      required: [source_system, file, sha256, size_bytes, parser_version, rule_version]
      properties:
        source_system: { type: string }
        file: { type: string }
        sha256: { type: string }
        size_bytes: { type: integer }
        parser_version: { type: string }
        rule_version: { type: string }
        disposition:
          type: string
          enum: [REFERENCE_COPY, NO_RECORDS]
        row_count: { type: integer }
        non_empty_cells: { type: integer }
        sheet_count: { type: integer }
    SourceComparisonPoint:
      type: object
      required: [period, wdf_counter_sales, laundro_machine_revenue]
      properties:
        period: { type: string }
        wdf_counter_sales: { type: string }
        laundro_machine_revenue: { type: string }
    SourceComparison:
      type: object
      required:
        [definition_version, formula, meaning, by_day, by_month, by_year, supported, limitations]
      properties:
        definition_version: { type: string }
        formula: { type: string }
        meaning: { type: string }
        by_day: { type: array, items: { $ref: "#/components/schemas/SourceComparisonPoint" } }
        by_month: { type: array, items: { $ref: "#/components/schemas/SourceComparisonPoint" } }
        by_year: { type: array, items: { $ref: "#/components/schemas/SourceComparisonPoint" } }
        supported: { type: object, additionalProperties: { type: boolean } }
        limitations: { type: array, items: { type: string } }
    AnalyticsUnavailableResponse:
      type: object
      additionalProperties: false
      required: [state, reason, detail]
      properties:
        state: { type: string, const: unavailable }
        reason: { type: string, const: ANALYTICS_ARTIFACT_NOT_BUILT }
        detail: { type: string }
    AnalyticsArtifactResponse:
      type: object
      required:
        [
          state,
          artifact_version,
          run_id,
          sources,
          metrics,
          machines,
          wdf_sales,
          source_comparison,
          health,
        ]
      properties:
        state: { type: string, const: available }
        artifact_version: { type: string }
        run_id: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/AnalyticsSource" } }
        metrics:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Metric" }
        machines: { type: object }
        wdf_sales: { type: object }
        source_comparison: { $ref: "#/components/schemas/SourceComparison" }
        health: { $ref: "#/components/schemas/DataHealth" }
    QualityResult:
      type: object
      additionalProperties: false
      required: [check_id, check, status, action_on_fail, detail]
      properties:
        check_id: { type: string }
        check: { type: string }
        status: { type: string, enum: [PASS, FAIL, NOT_EVALUATED] }
        action_on_fail: { type: string, enum: [block, warn, log] }
        detail: { type: string }
    DataHealth:
      type: object
      additionalProperties: false
      required: [checks, pass, fail, not_evaluated, blocking, results]
      properties:
        checks: { type: integer }
        pass: { type: integer }
        fail: { type: integer }
        not_evaluated: { type: integer }
        blocking: { type: integer }
        results: { type: array, items: { $ref: "#/components/schemas/QualityResult" } }
    MetricSummaryListResponse:
      type: object
      additionalProperties: false
      required: [state, run_id, metrics]
      properties:
        state: { type: string, const: available }
        run_id: { type: string }
        metrics: { type: array, items: { $ref: "#/components/schemas/MetricSummary" } }
    MetricDetailResponse:
      type: object
      additionalProperties: false
      required: [state, run_id, metric]
      properties:
        state: { type: string, const: available }
        run_id: { type: string }
        metric: { $ref: "#/components/schemas/Metric" }
    Area:
      type: string
      enum: [command-center, orders, analytics, finance, workforce, data-sources]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    SessionResponse:
      type: object
      additionalProperties: false
      required: [role, permittedAreas]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        permittedAreas:
          type: array
          items:
            $ref: "#/components/schemas/Area"
    OrderCoverage:
      type: object
      additionalProperties: false
      required: [state, reason, source, reportedTotal, returnedCount, lastSuccessfulSync]
      properties:
        state:
          type: string
          enum: [complete, partial, unavailable]
        reason:
          type: string
          enum: [COMPLETE_SOURCE_RECONCILED, SOURCE_PARTIAL, WDF_API_NOT_CONNECTED]
        source:
          type: string
          const: WDF POS
        reportedTotal:
          type: [integer, "null"]
          minimum: 0
        returnedCount:
          type: integer
          minimum: 0
        lastSuccessfulSync:
          type: [string, "null"]
          format: date-time
    OrderPage:
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
        hasMore:
          type: boolean
    NullableMoney:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount:
          description: Exact decimal string from the verified source; never binary floating point
          type: [string, "null"]
          pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
        currency:
          description: ISO 4217 code when confirmed by source or store configuration
          type: [string, "null"]
          pattern: "^[A-Z]{3}$"
    OrderPayment:
      type: object
      additionalProperties: false
      required: [sourceStatus, sourceMethod]
      properties:
        sourceStatus:
          type: [string, "null"]
        sourceMethod:
          type: [string, "null"]
    CustomerContext:
      type: object
      additionalProperties: false
      required: [identityState, displayName, email, phone]
      properties:
        identityState:
          type: string
          enum: [verified, explicitly_mapped, source_only, unresolved]
        displayName:
          type: [string, "null"]
        email:
          type: [string, "null"]
          format: email
        phone:
          type: [string, "null"]
    OrderSummary:
      type: object
      additionalProperties: false
      required: [id, sourceReference, createdAt, sourceStatus, customer, payment, total]
      properties:
        id:
          type: string
        sourceReference:
          type: string
        createdAt:
          type: [string, "null"]
          format: date-time
        sourceStatus:
          type: [string, "null"]
        customer:
          $ref: "#/components/schemas/CustomerContext"
        payment:
          $ref: "#/components/schemas/OrderPayment"
        total:
          $ref: "#/components/schemas/NullableMoney"
    OrderListResponse:
      type: object
      additionalProperties: false
      required: [items, coverage, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderSummary"
        coverage:
          $ref: "#/components/schemas/OrderCoverage"
        page:
          $ref: "#/components/schemas/OrderPage"
    OrderPromise:
      type: object
      additionalProperties: false
      required: [promisedReadyAt, promisedDeliveryAt]
      properties:
        promisedReadyAt:
          type: [string, "null"]
          format: date-time
        promisedDeliveryAt:
          type: [string, "null"]
          format: date-time
    OrderAssignment:
      type: object
      additionalProperties: false
      required: [employeeId, employeeDisplayName, machineReference]
      properties:
        employeeId:
          type: [string, "null"]
        employeeDisplayName:
          type: [string, "null"]
        machineReference:
          type: [string, "null"]
    OrderEvent:
      type: object
      additionalProperties: false
      required: [id, sourceType, sourceLabel, occurredAt, actorDisplayName]
      properties:
        id:
          type: string
        sourceType:
          type: string
        sourceLabel:
          type: string
        occurredAt:
          type: [string, "null"]
          format: date-time
        actorDisplayName:
          type: [string, "null"]
    OrderLineage:
      type: object
      additionalProperties: false
      required:
        [source, ingestionRunId, sourceRecordId, parserVersion, ruleVersion, sourceUpdatedAt]
      properties:
        source:
          type: string
          const: WDF POS
        ingestionRunId:
          type: string
        sourceRecordId:
          type: string
        parserVersion:
          type: string
        ruleVersion:
          type: string
        sourceUpdatedAt:
          type: [string, "null"]
          format: date-time
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          additionalProperties: false
          required:
            [
              serviceType,
              channel,
              subtotal,
              tax,
              tip,
              surcharge,
              promise,
              assignment,
              instructions,
              notes,
              events,
              lineage,
              unavailableFields,
            ]
          properties:
            serviceType:
              type: [string, "null"]
            channel:
              type: [string, "null"]
            subtotal:
              $ref: "#/components/schemas/NullableMoney"
            tax:
              $ref: "#/components/schemas/NullableMoney"
            tip:
              $ref: "#/components/schemas/NullableMoney"
            surcharge:
              $ref: "#/components/schemas/NullableMoney"
            promise:
              $ref: "#/components/schemas/OrderPromise"
            assignment:
              $ref: "#/components/schemas/OrderAssignment"
            instructions:
              type: [string, "null"]
            notes:
              type: [string, "null"]
            events:
              type: array
              items:
                $ref: "#/components/schemas/OrderEvent"
            lineage:
              $ref: "#/components/schemas/OrderLineage"
            unavailableFields:
              type: array
              uniqueItems: true
              items:
                type: string
    OrderDetailResponse:
      type: object
      additionalProperties: false
      required: [order, coverage]
      properties:
        order:
          $ref: "#/components/schemas/OrderDetail"
        coverage:
          $ref: "#/components/schemas/OrderCoverage"
    EmptyCollectionResponse:
      type: object
      additionalProperties: false
      required: [items, state]
      properties:
        items:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [not_connected, available]
    UnavailableAreaResponse:
      type: object
      additionalProperties: false
      required: [state, reason]
      properties:
        state:
          type: string
          const: not_connected
        reason:
          type: string
    ConnectionState:
      type: object
      additionalProperties: false
      required: [source, connected, lastSuccessfulCheck]
      properties:
        source:
          type: string
          enum: [WDF POS, LaundroPortal / Laundrolux]
        connected:
          type: boolean
          const: false
        lastSuccessfulCheck:
          type: [string, "null"]
          format: date-time
    DataSourcesResponse:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ConnectionState"
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, correlationId]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        correlationId:
          type: string
